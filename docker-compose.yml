services:
  # Postgres bootstrapped el 2026-05-08 — todavía NO usado por server/runner.
  # `profiles: [postgres]` hace que NO arranque por default. Para activarlo:
  #   docker compose --profile postgres up -d postgres
  # Cuando se haga el switch a PG (plan: docs/POSTGRES_MIGRATION.md):
  #   1) Setear POSTGRES_PASSWORD en .env
  #   2) docker compose --profile postgres up -d postgres
  #   3) Migrar data: python scripts/postgres/migrate_data.py --pg-dsn ...
  #   4) Setear DB_BACKEND=postgres en .env
  #   5) docker compose restart server runner
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_set_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-copybot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Sólo bind a localhost para que no quede expuesto en la red.
      # Acceso remoto sólo via Tailscale + SSH tunnel.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copybot} -d ${POSTGRES_DB:-copybot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/rafalez72/bot_trading:latest
    pull_policy: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python copybot.py serve --port 8000
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Cuando DB_BACKEND=postgres se active, descomentar para que el
    # server espere a que postgres esté listo antes de arrancar.
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  runner:
    image: ghcr.io/rafalez72/bot_trading:latest
    pull_policy: always
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python copybot.py run-paper
    restart: unless-stopped
    depends_on:
      - server
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  pgdata:
