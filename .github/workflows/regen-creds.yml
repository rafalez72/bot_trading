name: Regen Polymarket API Creds

# Multi-runner: prueba en paralelo Linux, Windows, macOS — cada uno tiene
# pool de IPs diferente. Si alguno pasa el bloqueo de Cloudflare, ya está.
# fail-fast: false → no se aborta el resto si uno falla.

on:
  workflow_dispatch:
    inputs:
      sig_type:
        description: "Signature type (0=EOA, 1=POLY_PROXY, 2=POLY_GNOSIS_SAFE)"
        required: true
        default: "2"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

jobs:
  regen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q py-clob-client
      - name: Show runner IP / location
        shell: bash
        run: |
          echo "=== Runner: ${{ matrix.os }} ==="
          curl -s -m 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc)=" || true
      - name: Regen creds
        shell: bash
        env:
          PK: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          FUNDER: ${{ secrets.POLYMARKET_FUNDER_ADDRESS }}
          SIG: ${{ inputs.sig_type }}
        run: |
          if [ -z "$PK" ] || [ -z "$FUNDER" ]; then
            echo "::error::Faltan secrets POLYMARKET_PRIVATE_KEY o POLYMARKET_FUNDER_ADDRESS"
            exit 1
          fi
          # Reintentos con backoff dentro de un mismo runner
          for i in 1 2 3; do
            echo "=== Intento $i en ${{ matrix.os }} ==="
            if python scripts/regen_creds_auto.py; then
              echo "::notice::SUCCESS en ${{ matrix.os }} intento $i"
              exit 0
            fi
            sleep 5
          done
          exit 1
