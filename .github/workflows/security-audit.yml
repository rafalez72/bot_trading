name: security-audit

# Auditoría de deps semanal. Background: malware Polymarket bots Dic-2025 +
# typo-squat PyPI Ene-2026. Cron lunes 08:00 UTC + manual via workflow_dispatch.
on:
  schedule:
    - cron: '0 8 * * 1'  # lunes 8am UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      # Instala el proyecto + extras de prod para auditar el set REAL de deps.
      # (pip-audit ya no acepta --requirement pyproject.toml; audita el entorno.)
      - name: Install project deps
        run: pip install -e ".[live,postgres,analytics,dashboard]"

      - name: Run pip-audit (strict)
        run: pip-audit --strict
