<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Copy Bot">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Polymarket Copy Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div x-data="dashboard()" x-init="init()" class="px-3 py-2 max-w-md mx-auto">

        <!-- Header compacto -->
        <header class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
                <h1 class="text-sm font-bold">Copy Bot</h1>
                <span class="text-[10px] px-1.5 py-0.5 rounded border"
                      :class="modeLabel.cls"
                      x-text="modeLabel.txt"></span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-500">
                    <span x-text="lastUpdate"></span> · <span x-text="countdown"></span>s
                </span>
                <button @click="refresh()" class="p-1 rounded active:bg-slate-800">
                    <svg class="w-4 h-4" :class="loading && 'animate-spin'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.582m0 0a8.003 8.003 0 01-15.356-2m15.356 2H15"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Kill switch banner (solo si activo) -->
        <div x-show="killActive"
             class="bg-rose-950/60 border border-rose-800 rounded-lg px-3 py-2 mb-2 flex items-center gap-2">
            <span class="text-base">⛔</span>
            <div class="flex-1 min-w-0">
                <p class="text-xs font-semibold text-rose-300">Kill switch activo</p>
                <p class="text-[10px] text-rose-400 truncate" x-text="summary?.kill_switch?.reason || ''"></p>
            </div>
        </div>

        <!-- PnL grande -->
        <div class="grid grid-cols-2 gap-2 mb-2">
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
                <p class="text-[10px] text-slate-400 uppercase tracking-wider">PnL 24h</p>
                <p class="text-2xl font-bold leading-tight"
                   :class="pnl24h >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                   x-text="fmtUsdSigned(pnl24h)"></p>
                <p class="text-[10px] text-slate-500 mt-0.5">
                    <span x-text="liveSummary?.today?.wins ?? 0"></span>W /
                    <span x-text="liveSummary?.today?.losses ?? 0"></span>L
                </p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
                <p class="text-[10px] text-slate-400 uppercase tracking-wider">PnL total</p>
                <p class="text-2xl font-bold leading-tight"
                   :class="pnlTotal >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                   x-text="fmtUsdSigned(pnlTotal)"></p>
                <p class="text-[10px] text-slate-500 mt-0.5">
                    ROI <span x-text="(liveSummary?.totals?.roi_pct ?? 0).toFixed(1) + '%'"></span>
                </p>
            </div>
        </div>

        <!-- Stats row -->
        <div class="grid grid-cols-4 gap-1.5 mb-2 text-center">
            <div class="bg-slate-900 border border-slate-800 rounded-lg py-1.5">
                <p class="text-[9px] text-slate-500 uppercase">WR</p>
                <p class="text-sm font-bold text-indigo-300" x-text="fmtPct(winRate)"></p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg py-1.5">
                <p class="text-[9px] text-slate-500 uppercase">Abiertas</p>
                <p class="text-sm font-bold text-amber-300" x-text="openCount"></p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg py-1.5">
                <p class="text-[9px] text-slate-500 uppercase">Wallets</p>
                <p class="text-sm font-bold text-emerald-300" x-text="walletsActive"></p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg py-1.5">
                <p class="text-[9px] text-slate-500 uppercase">Drop</p>
                <p class="text-sm font-bold text-rose-300" x-text="walletsDropped"></p>
            </div>
        </div>

        <!-- Posiciones abiertas -->
        <div class="mb-2" x-show="openCount > 0">
            <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Abiertas</p>
            <div class="space-y-1">
                <template x-for="t in liveTrades.filter(x => x.status === 'open').slice(0, 3)" :key="t.id">
                    <div class="bg-slate-900 border border-slate-800 rounded-md px-2 py-1.5 flex items-center justify-between text-xs">
                        <div class="flex-1 min-w-0">
                            <span class="text-slate-300 font-mono" x-text="shortWallet(t.source_wallet)"></span>
                            <span class="text-slate-500 ml-1.5" x-text="'$' + (t.entry_size_usdc ?? 0).toFixed(2)"></span>
                            <span class="text-slate-500 ml-1.5" x-text="'@' + (t.entry_price ?? 0).toFixed(3)"></span>
                        </div>
                        <span class="text-[10px] text-slate-500" x-show="t.peak_price"
                              x-text="'peak ' + (t.peak_price ?? 0).toFixed(3)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Últimos trades cerrados -->
        <div class="mb-2">
            <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Últimos cierres</p>
            <div class="space-y-0.5">
                <template x-for="t in liveTrades.filter(x => x.status !== 'open').slice(0, 6)" :key="t.id">
                    <div class="bg-slate-900/60 border border-slate-800/60 rounded px-2 py-1 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-1.5 flex-1 min-w-0">
                            <span x-text="(t.pnl_usdc ?? 0) >= 0 ? '🟢' : '🔴'"></span>
                            <span class="font-bold tabular-nums"
                                  :class="(t.pnl_usdc ?? 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                                  x-text="fmtUsdSigned(t.pnl_usdc)"></span>
                            <span class="text-slate-500 font-mono text-[10px]" x-text="shortWallet(t.source_wallet)"></span>
                        </div>
                        <span class="text-[10px] text-slate-600" x-text="hhmm(t.exit_at)"></span>
                    </div>
                </template>
                <p x-show="liveTrades.filter(x => x.status !== 'open').length === 0"
                   class="text-[10px] text-slate-600 text-center py-2">sin cierres aún</p>
            </div>
        </div>

        <!-- Top performers -->
        <div class="mb-2" x-show="liveSummary?.top_wallets?.length > 0">
            <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Top wallets</p>
            <div class="space-y-0.5">
                <template x-for="w in (liveSummary?.top_wallets || []).slice(0, 4)" :key="w.wallet">
                    <div class="bg-slate-900/60 border border-slate-800/60 rounded px-2 py-1 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400 font-mono text-[10px]" x-text="w.wallet.slice(0,10)+'…'"></span>
                            <span class="text-slate-500 text-[10px]">
                                <span x-text="w.wins"></span>W/<span x-text="w.losses"></span>L
                            </span>
                        </div>
                        <span class="font-bold tabular-nums"
                              :class="(w.pnl ?? 0) >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                              x-text="fmtUsdSigned(w.pnl)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Footer mini -->
        <div class="text-[10px] text-slate-600 text-center mt-2">
            <span x-show="liveSummary?.config">
                base $<span x-text="liveSummary?.config?.base_usdc"></span>
                · cap $<span x-text="liveSummary?.config?.capital_usdc"></span>
                · wallet $<span x-text="liveSummary?.config?.max_per_wallet_usdc"></span>
            </span>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
