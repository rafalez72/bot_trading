[project]
name = "polymarket-copybot"
version = "0.1.0"
description = "Copy trading bot for Polymarket — Phase 1: data indexer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
]
analytics = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
]
live = [
    "py-clob-client-v2>=1.0.0",
    "eth-account>=0.10.0",
    "web3>=6.10.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
